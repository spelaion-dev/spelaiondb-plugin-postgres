[package]
name = "spelaiondb-plugin-postgres"
description = "PostgreSQL for SpelaionDB: the engine's driver, served as a plugin"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/spelaion-dev/spelaiondb-plugin-postgres"
publish = false

# The driver keeps the name it had inside SpelaionDB: its tests and the program use it.
[lib]
name = "spelaion_driver_postgres"

[[bin]]
name = "spelaiondb-plugin-postgres"
path = "src/bin/spelaiondb-plugin-postgres.rs"

# The contract, the engine's dialect and the plugin's side of the protocol come from
# SpelaionDB's repository, by tag (ADR-042): they are one workspace there, so one tag pins
# them together. Moving the tag is how this plugin follows a protocol change.
[dependencies]
spelaion-driver-api = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.1" }
spelaion-dialect = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.1" }
spelaion-plugin-sdk = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.1" }
# The same Arrow as SpelaionDB's: batches cross the two unchanged.
arrow = { version = "60", default-features = false, features = ["ipc"] }
async-stream = "0.3"
async-trait = "0.1"
# COPY data for imports (SpelaionDB's ADR-038).
bytes = "1"
fallible-iterator = "0.2"
futures-util = "0.3"
postgres-protocol = "0.6"
# ring instead of aws-lc-rs: the latter needs CMake and NASM on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
# `net` and `io-util`: the cancel request opens its own socket and waits for its close.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
# Patched: see vendor/tokio-postgres.
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }

[dev-dependencies]
insta = "1"
# The conformance set every plugin runs against its own program (tests/conformance.rs).
spelaion-plugin-host = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.1" }

# tokio-postgres as SpelaionDB patched it (vendor/tokio-postgres/PATCHED.md): read it before
# upgrading.
[patch.crates-io]
tokio-postgres = { path = "vendor/tokio-postgres" }

[lints.rust]
unsafe_code = "forbid"

# What ships is this program: small and without the debugger's tables.
[profile.release]
strip = "symbols"
